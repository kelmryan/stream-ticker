version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npx nodemon server/index.js

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ticker
      POSTGRES_PASSWORD: ticker_dev
      POSTGRES_DB: stream_ticker
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
